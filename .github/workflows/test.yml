{"name":"test-symbol","on":{"workflow_dispatch":{"inputs":{"symbol":{"description":"Ticker, e.g. EURUSD=X or AAPL","required":true,"default":"EURUSD=X"}}}},"permissions":{"contents":"write"},"jobs":{"run":{"runs-on":"ubuntu-latest","env":{"SYMBOL":"${{ inputs.symbol }}"},"steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"run":"pip install yfinance pandas matplotlib"},{"run":"python gold.py backtest > result.txt 2>&1; python chart.py >> result.txt 2>&1; S=${SYMBOL//[^A-Za-z0-9]/_}; mv result.txt result_$S.txt; mv gold_chart.png chart_$S.png; mv gold_2y.png chart_2y_$S.png"},{"run":"git config user.name bot && git config user.email bot@users.noreply.github.com && git add result_*.txt chart_*.png chart_2y_*.png && git commit -m test-symbol && git push"}]}}}
